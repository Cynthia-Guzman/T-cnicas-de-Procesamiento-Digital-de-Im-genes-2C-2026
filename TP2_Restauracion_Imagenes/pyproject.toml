[project]
name = "tpi2-restauracion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "diffusers>=0.43.0",
    "gradio>=6.32.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
tpi2-restauracion = "tpi2_restauracion:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
